<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CoolTown · stay cool</title>
  <meta name="description" content="CoolTown is a living city on Arc. Tokens become buildings. Stay cool." />
  <meta name="theme-color" content="#22b1fd" />
  <link rel="icon" href="logo.jpg" />
  <meta property="og:title" content="CoolTown" />
  <meta property="og:description" content="A living city on Arc. Stay cool." />
  <meta property="og:image" content="banner.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sky: #22b1fd;
      --sky-deep: #0b86e6;
      --ink: #14325c;
      --muted: #3d6494;
      --yellow: #ffd24a;
      --gold: #f5a623;
      --card: #ffffff;
      --shadow: #0b78d0;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Nunito", sans-serif;
      background:
        radial-gradient(900px 420px at 12% -10%, rgba(255,255,255,.45), transparent 60%),
        radial-gradient(700px 380px at 100% 0%, rgba(255,255,255,.28), transparent 55%),
        linear-gradient(180deg, #5ec8ff 0%, var(--sky) 28%, #1496f6 100%);
    }

    a { color: inherit; }

    .wrap {
      width: min(980px, calc(100% - 28px));
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 0 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .brand img {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      object-fit: cover;
      border: 3px solid #fff;
      box-shadow: 0 4px 0 var(--shadow);
    }

    .word {
      font-family: "Lilita One", sans-serif;
      font-size: 30px;
      letter-spacing: 0.4px;
      line-height: 1;
      color: #fff;
      text-shadow: 0 3px 0 #1676d6;
    }

    .word span {
      color: var(--yellow);
      text-shadow: 0 3px 0 #e18412;
    }

    nav {
      display: flex;
      gap: 8px;
    }

    nav a {
      text-decoration: none;
      font-weight: 800;
      font-size: 14px;
      color: var(--ink);
      background: #fff;
      border-radius: 999px;
      padding: 8px 14px;
      box-shadow: 0 3px 0 var(--shadow);
    }

    nav a:hover { transform: translateY(-1px); }

    .hero { padding: 10px 0 6px; }

    .banner {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 28px;
      border: 4px solid #fff;
      box-shadow: 0 8px 0 var(--shadow);
    }

    .tagline {
      margin: 18px 0 0;
      text-align: center;
      color: #fff;
      font-weight: 800;
      font-size: 18px;
      text-shadow: 0 2px 0 rgba(11, 120, 208, .55);
    }

    .panel {
      margin-top: 14px;
      background: #fff;
      border-radius: 22px;
      padding: 14px;
      box-shadow: 0 6px 0 var(--shadow);
      display: grid;
      gap: 12px;
    }

    .ca {
      width: 100%;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 12px;
      text-align: left;
      border: 0;
      cursor: pointer;
      background: #eef7ff;
      color: var(--ink);
      border-radius: 16px;
      padding: 10px 10px 10px 14px;
      font: inherit;
    }

    .ca:focus-visible {
      outline: 3px solid var(--yellow);
      outline-offset: 2px;
    }

    .ca-kicker {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.14em;
      color: var(--sky-deep);
    }

    .ca-value {
      font-family: "Lilita One", sans-serif;
      font-size: 28px;
      letter-spacing: 0.4px;
      line-height: 1;
    }

    .copy {
      background: linear-gradient(#ffe56a, var(--gold));
      color: #5a3200;
      font-weight: 800;
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      min-width: 92px;
      box-shadow: 0 3px 0 #d98410;
      pointer-events: none;
    }

    .socials {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .socials a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      font-weight: 800;
      background: #f4f9ff;
      border-radius: 14px;
      padding: 12px 8px;
      box-shadow: inset 0 0 0 2px #d7ebfb;
    }

    .socials a:hover { background: #fff; }

    .socials svg { width: 18px; height: 18px; flex: none; }

    section { padding: 22px 0 0; }

    .card {
      background: #fff;
      border-radius: 24px;
      padding: 16px;
      box-shadow: 0 6px 0 var(--shadow);
    }

    .card h2 {
      margin: 2px 4px 12px;
      font-family: "Lilita One", sans-serif;
      font-size: 28px;
      font-weight: 400;
      letter-spacing: 0.3px;
    }

    .chart-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .chart-head a {
      font-weight: 800;
      font-size: 14px;
      color: var(--sky-deep);
      text-decoration: none;
    }

    .chart {
      height: 520px;
      border-radius: 16px;
      overflow: hidden;
      background: #f7fbff;
    }

    .chart iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .posts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      align-items: start;
    }

    .post {
      background: #f7fbff;
      border-radius: 16px;
      min-height: 180px;
      padding: 8px;
      overflow: hidden;
    }

    .post .twitter-tweet { margin: 0 !important; }

    footer {
      padding: 22px 0 32px;
      text-align: center;
      color: #fff;
      font-weight: 800;
      font-size: 13px;
      text-shadow: 0 2px 0 rgba(11, 120, 208, .45);
    }

    footer p { margin: 4px 0; }

    @media (max-width: 720px) {
      .word { font-size: 24px; }
      nav a { padding: 8px 10px; }
      .socials { grid-template-columns: 1fr; }
      .posts { grid-template-columns: 1fr; }
      .ca { grid-template-columns: 1fr auto; }
      .ca-kicker { grid-column: 1 / -1; }
      .chart { height: 460px; }
      .ca-value { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="brand" href="#top">
        <img src="logo.jpg" alt="CoolTown logo" />
        <div class="word">COOL<span>TOWN</span></div>
      </a>
      <nav>
        <a href="#chart">Chart</a>
        <a href="#posts">Posts</a>
      </nav>
    </header>

    <main id="top">
      <section class="hero">
        <img class="banner" src="banner.png" alt="CoolTown banner over the city" />
        <p class="tagline">A living city on Arc. Tokens become buildings. Stay cool.</p>
        <div class="panel">
          <button class="ca" id="copy-ca" type="button" aria-describedby="copy-status">
            <span class="ca-kicker">CA</span>
            <span class="ca-value" id="ca-text">0x9c6bd8e5f033ddcf4adbee0c9560a886c3088c78</span>
            <span class="copy" id="copy-label">Copy</span>
          </button>
          <div class="socials">
            <a href="https://x.com/cooltownarc" target="_blank" rel="noopener noreferrer">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M14.7 10.3 22.4 1.5h-1.8l-6.7 7.6L8.6 1.5H2l8.1 11.5L2 22.5h1.8l7.1-8.1 5.7 8.1H22l-7.3-12.2Zm-2.5 2.8-.8-1.2L4.5 2.9h2.8l5.3 7.4.8 1.2 6.9 9.6h-2.8l-5.3-7.9Z"/></svg>
              X
            </a>
            <a href="https://t.me/usdciscool" target="_blank" rel="noopener noreferrer">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21.8 4.2 2.9 11.5c-1.3.5-1.3 1.2-.2 1.5l4.8 1.5 1.9 5.8c.2.7.1.9.8.9.5 0 .7-.2 1-.5l2.7-2.6 5.6 4.1c1 .6 1.8.3 2-.9l3.6-16.8c.4-1.5-.6-2.2-1.6-1.7ZM8.8 14.3l9.6-6c.5-.3.9-.1.5.2l-8 7.2-.3 3.3-2-4.7Z"/></svg>
              Telegram
            </a>
            <a href="https://dexscreener.com/arc/0x06e9096745e8e5b939b4aa37187242bbfa38c7a337fe3cab430fd8c8a7cbbd96" target="_blank" rel="noopener noreferrer">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 19V9h3v10H4Zm6.5 0V5h3v14h-3ZM17 19v-7h3v7h-3Z"/></svg>
              Chart
            </a>
          </div>
          <span id="copy-status" hidden>Copied</span>
        </div>
      </section>

      <section id="chart">
        <div class="card">
          <div class="chart-head">
            <h2>Chart</h2>
            <a href="https://dexscreener.com/arc/0x06e9096745e8e5b939b4aa37187242bbfa38c7a337fe3cab430fd8c8a7cbbd96" target="_blank" rel="noopener noreferrer">Open Dexscreener</a>
          </div>
          <div class="chart">
            <iframe
              title="COOL chart on Dexscreener"
              src="https://dexscreener.com/arc/0x06e9096745e8e5b939b4aa37187242bbfa38c7a337fe3cab430fd8c8a7cbbd96?embed=1&loadChartSettings=0&trades=0&tabs=0&info=0&chartLeftToolbar=0&chartDefaultOnMobile=1&chartTheme=light&theme=light&chartStyle=0&chartType=usd&interval=15"
            ></iframe>
          </div>
        </div>
      </section>

      <section id="posts">
        <div class="card">
          <h2>Posts</h2>
          <div class="posts">
            <div class="post">
              <blockquote class="twitter-tweet" data-theme="light" data-dnt="true" data-conversation="none">
                <a href="https://x.com/jerallaire/status/2107845231358194130">Jeremy Allaire on CoolTown</a>
              </blockquote>
            </div>
            <div class="post">
              <blockquote class="twitter-tweet" data-theme="light" data-dnt="true" data-conversation="none">
                <a href="https://x.com/cooltownarc/status/2107791669366235143">CoolTown announcement</a>
              </blockquote>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <p>Stay cool.</p>
      <p>Independent community meme. Not affiliated with Circle, USDC, or Arc.</p>
    </footer>
  </div>

  <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
  <script>
    const button = document.getElementById("copy-ca");
    const label = document.getElementById("copy-label");
    const status = document.getElementById("copy-status");
    const ca = "0x9c6bd8e5f033ddcf4adbee0c9560a886c3088c78";

    button.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(ca);
      } catch (err) {
        const area = document.createElement("textarea");
        area.value = ca;
        document.body.appendChild(area);
        area.select();
        document.execCommand("copy");
        area.remove();
      }
      label.textContent = "Copied";
      status.hidden = false;
      setTimeout(() => {
        label.textContent = "Copy";
        status.hidden = true;
      }, 1400);
    });
  </script>
</body>
</html>
